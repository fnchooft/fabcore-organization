name: Inject Code Snippets for GitBook

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject snippets into docs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DOCS_DIR: getting-started # folder GitBook reads from
        run: python3 .github/scripts/inject_snippets.py

      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "ci: inject code snippets [skip ci]"
          git push
